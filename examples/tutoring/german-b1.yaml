version: 1
meta:
  title: Ein Fest trotz Regen
  description: Alternativen vergleichen, Gründe nennen und gemeinsam einen Plan ändern.
  locale: de
  language: German
  level: B1
  durationMinutes: 45
  objectives:
    - Vor- und Nachteile zweier Möglichkeiten erklären.
    - Mit « weil » und « obwohl » begründen und einschränken.
    - Einen gemeinsamen Plan verständlich zusammenfassen.
design:
  aspectRatio: 16:9
  theme:
    family: clean
    colors:
      background: "#FFFFFF"
      foreground: "#172B3A"
      muted: "#526473"
      accent: "#1765B0"
      surface: "#F0F5FA"
      border: "#CAD8E4"
      charts:
        - "#1765B0"
        - "#14786F"
        - "#8B4BA1"
        - "#A65014"
        - "#B13A55"
        - "#506A28"
    fonts:
