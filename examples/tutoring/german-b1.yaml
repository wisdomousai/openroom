      body: sans
  defaultMasterId: standard
  masters:
    - id: standard
      name: Standard
      safeArea: 8
      decoration: rule
      footer: Deutsch · B1
    - id: compact
      name: More room for content
      safeArea: 6
      decoration: rule
      footer: Deutsch · B1
    - id: opening
      name: Opening
      safeArea: 8
