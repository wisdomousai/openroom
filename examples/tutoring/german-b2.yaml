version: 1
meta:
  title: Fortbildung, die im Alltag hilft
  description: Ein Angebot kritisch prüfen, Einwände aufgreifen und eine Empfehlung formulieren.
  locale: de
  language: German
  level: B2
  durationMinutes: 50
  objectives:
    - Ein Beispiel von einer belastbaren Begründung unterscheiden.
    - Einen Einwand fair wiedergeben und beantworten.
    - Eine Empfehlung mit Bedingungen und einem überprüfbaren Ziel formulieren.
