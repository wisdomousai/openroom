version: 1
meta:
  title: Deux jours à distance ?
  description: Nuancer une proposition, répondre à une objection et négocier un essai.
  locale: fr
  language: French
  level: B2
  durationMinutes: 50
  objectives:
    - Présenter une position avec une réserve.
    - Distinguer un exemple d’une preuve.
    - Négocier un compromis et des critères pour l’évaluer.
design:
  aspectRatio: 16:9
  theme:
    family: paper
    colors:
      background: "#F8F3E9"
      foreground: "#302C28"
      muted: "#655D52"
      accent: "#9D3E28"
      surface: "#EEE5D5"
      border: "#CFC2AD"
      charts:
        - "#9D3E28"
        - "#47624C"
