name: OpenRoom CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  # Never interrupt a production migration or upload with a newer push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      # The core (packages, relay, stage, participant, office, Desktop) builds
      # from a checkout that has no apps/workspace or apps/workspace-worker,
      # and Desktop's core renderer (file and presentation windows) is in it.
      - name: Build the core without the workspace apps
        run: |
          core="$RUNNER_TEMP/openroom-core"
          mkdir -p "$core"
          git archive --format=tar HEAD | tar -x -C "$core"
          rm -rf "$core/apps/workspace" "$core/apps/workspace-worker"
          cd "$core"
          bun install
          bun run build:core
          test -f apps/desktop/renderer/core/index.html || { echo 'build:core produced no Desktop core renderer (apps/desktop/renderer/core/index.html).' >&2; exit 1; }
          test ! -e apps/desktop/renderer/host || { echo 'A core-only build must not contain the workspace bundle (apps/desktop/renderer/host).' >&2; exit 1; }
      - name: Check and build every workspace
        run: bun run verify
      - name: Restore synthetic D1 and R2 data into an isolated installation
        run: bun run verify:recovery
      - name: Install Chromium
        working-directory: e2e
        run: bunx playwright install --with-deps chromium
      - name: Browser journeys against isolated local storage
        run: bun run verify:browser
      - name: Manual links, search, screenshots, mobile and print
        run: bun run verify:browser --config manual/playwright.config.ts
      - name: Package the verified build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: tar -czf "$RUNNER_TEMP/openroom-build.tar.gz" packages/*/dist apps/workspace-worker/public apps/relay/public
      - name: Keep the verified build for deployment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openroom-build-${{ github.sha }}
          path: ${{ runner.temp }}/openroom-build.tar.gz
          retention-days: 7
          if-no-files-found: error
      - name: Keep browser evidence and local Worker diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-evidence
          path: |
            e2e/test-results/
            e2e/verification-output/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    needs: verify
    # Only the canonical repository deploys openroom.app; forks run checks only.
    # Configure this repository variable only after the production environment
    # and its token exist. Until then, CI runs without creating an environment.
    if: github.repository == 'wisdomousai/openroom' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://openroom.app
    concurrency:
      group: openroom-production
      cancel-in-progress: false
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Skip a build superseded on main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer main commit will deploy after its checks pass.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.current.outputs.deploy == 'true'
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.current.outputs.deploy == 'true'
        with:
          bun-version-file: package.json
      - name: Install locked deployment tools
        if: steps.current.outputs.deploy == 'true'
        run: bun install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.current.outputs.deploy == 'true'
        with:
          name: openroom-build-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Restore the verified build
        if: steps.current.outputs.deploy == 'true'
        run: tar -xzf "$RUNNER_TEMP/openroom-build.tar.gz"
      # The relay owns SessionDO; the control plane binds it by script name and
      # forwards the live pages to it, so the relay always deploys first.
      - name: Deploy the relay (live plane)
        if: steps.current.outputs.deploy == 'true'
        working-directory: apps/relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Set the production CLOUDFLARE_API_TOKEN secret.' >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Set the production CLOUDFLARE_ACCOUNT_ID variable.' >&2; exit 1; }
          bun x --no-install wrangler deploy
      - name: Apply migrations and deploy the control plane
        if: steps.current.outputs.deploy == 'true'
        working-directory: apps/workspace-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Set the production CLOUDFLARE_API_TOKEN secret.' >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Set the production CLOUDFLARE_ACCOUNT_ID variable.' >&2; exit 1; }
          bun x --no-install wrangler d1 migrations apply openroom --remote
          bun x --no-install wrangler deploy
      - name: Verify production health and published assets
        if: steps.current.outputs.deploy == 'true'
        run: node scripts/ci/verify-deployment.mjs https://openroom.app
      - name: Record the release
        if: steps.current.outputs.deploy == 'true'
        run: |
          echo "Deployed commit $GITHUB_SHA to https://openroom.app" >> "$GITHUB_STEP_SUMMARY"
          echo 'Verified production health, app entry points, manual chapters, search data, screenshots and linked assets against the build.' >> "$GITHUB_STEP_SUMMARY"
